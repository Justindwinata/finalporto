<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRUD Produk Demo - Justin Dwinata</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
  <style>
    body{cursor:auto}.demo{min-height:100vh;padding:7rem 0;background:var(--black)}.grid{display:grid;grid-template-columns:320px 1fr;gap:1.4rem}.panel{background:var(--black-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.5rem}.input{width:100%;padding:.8rem;margin:.45rem 0;background:var(--black-3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--white)}table{width:100%;border-collapse:collapse;color:var(--muted)}td,th{padding:.8rem;border-bottom:1px solid var(--border);text-align:left}th{color:var(--green);font-family:var(--font-mono);font-size:.75rem}.mini{padding:.35rem .65rem;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--white);margin-right:.35rem}@media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="demo"><div class="wrap"><a href="/#work" class="btn btn-o" style="margin-bottom:2rem">Kembali ke Works</a><div class="sec-tag">Static Spring Boot Demo</div><h1 class="sec-title">CRUD Product <em>Management.</em></h1><div class="grid"><section class="panel"><h2 id="formTitle">Tambah Produk</h2><input class="input" id="name" placeholder="Nama produk"/><input class="input" id="price" type="number" placeholder="Harga"/><input class="input" id="stock" type="number" placeholder="Stok"/><button class="btn btn-g" id="save">Simpan</button><p class="about-text" id="msg"></p></section><section class="panel"><table><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></section></div></div></main>
  <script>
    let data=[{name:'Keyboard Mechanical',price:450000,stock:8},{name:'Mouse Wireless',price:175000,stock:14}],edit=-1;
    function render(){rows.innerHTML=data.map((p,i)=>`<tr><td>${p.name}</td><td>Rp${p.price.toLocaleString('id-ID')}</td><td>${p.stock}</td><td><button class="mini" onclick="editRow(${i})">Edit</button><button class="mini" onclick="delRow(${i})">Hapus</button></td></tr>`).join('');}
    save.onclick=()=>{if(!name.value||!price.value||!stock.value){msg.textContent='Semua field wajib diisi.';return;}const item={name:name.value,price:+price.value,stock:+stock.value};if(edit>=0){data[edit]=item;edit=-1;formTitle.textContent='Tambah Produk';}else data.push(item);name.value=price.value=stock.value='';msg.textContent='Data tersimpan di simulasi frontend.';render();};
    window.editRow=i=>{edit=i;name.value=data[i].name;price.value=data[i].price;stock.value=data[i].stock;formTitle.textContent='Edit Produk';};
    window.delRow=i=>{data.splice(i,1);render();};render();
  </script>
</body>
</html>
